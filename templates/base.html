<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="慢记，一处记录设计、技术与日常生活的安静角落。"><title>{% block title %}慢记 Slow Notes · 在快世界里，慢慢记录{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script></head>
